; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare2_8_dev_drivbrd

[env:waveshare2_8_dev_drivbrd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
; platform_packages =
; 	platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git
; 	platformio/framework-arduinoespressif32-libs@https://github.com/espressif/esp32-arduino-libs.git#idf-release/v5.1
board = esp32s3LCDDriverBoard
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	https://github.com/esp-arduino-libs/ESP32_Display_Panel.git
	https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
	https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
	lvgl/lvgl @^9.2.0
	;tttapa/Arduino Filters@^1.0.0
	; handmade0octopus/ESP32-TWAI-CAN@^1.0.1
build_flags = 
	-I include
	-D ESP_UTILS_CONF_ENABLE_LOG_TRACE
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=4
	-D SCREEN_ID_MAIN=1
	-D TICKS=2
	-D DISP_VALUES_REFRESH_INTERVAL=100
	-D OBD_QUERY_REFRESH_INTERVAL=200
	-D ARC_ANIMATION_TIME=115
	-D ANIMATE=1
	-D TEST_GENERATOR
	; -D LV_CONF_SKIP
	-D LV_CONF_INCLUDE_SIMPLE
	-D LV_LVGL_H_INCLUDE_SIMPLE
	; -D LV_FONT_MONTSERRAT_48
	; -D LV_COLOR_DEPTH=16
	-D LV_HOR_RES_MAX=480
	-D LV_VER_RES_MAX=480
	;-D LV_TICK_CUSTOM
	; -D LV_USE_LOG
	; -D LV_LOG_LEVEL=LV_LOG_LEVEL_INFO
	; -D LV_LOG_PRINTF
	; -D LV_USE_FLOAT=1
	; -D LV_USE_SYSMON=1
	; -D LV_USE_PERF_MONITOR=1
	; -D LV_USE_PERF_MONITOR_POS=LV_ALIGN_TOP_MID
	; -D LV_USE_MEM_MONITOR=1
	; -D LV_USE_MEM_MONITOR_POS=LV_ALIGN_BOTTOM_MID
